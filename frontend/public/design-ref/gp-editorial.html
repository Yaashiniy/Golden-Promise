document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rid.dataset.built = '1';\n      cats.forEach(([label, id], i) => {\n        const card = document.createElement('div');\n        card.setAttribute('data-reveal', '');\n        card.setAttribute('data-delay', String((i % 4) * 90));\n        card.setAttribute('data-zoom', '');\n        card.style.cssText = 'position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:8px;cursor:pointer;box-shadow:0 14px 34px rgba(78,18,24,.14)';\n        const slot = document.createElement('image-slot');\n        slot.setAttribute('id', id); slot.setAttribute('shape', 'rect'); slot.setAttribute('placeholder', label);\n        slot.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';\n        const overlay = document.createElement('div');\n        overlay.style.cssText = 'position:absolute;inset:0;background:linear-gradient(to top,rgba(78,18,24,.82) 0%,rgba(123,31,42,.22) 46%,transparent 74%);pointer-events:none';\n        const border = document.createElement('div');\n        border.style.cssText = 'position:absolute;inset:0;border:2px solid transparent;border-radius:8px;pointer-events:none;transition:border-color .4s';\n        const cap = document.createElement('div');\n        cap.style.cssText = 'position:absolute;left:0;right:0;bottom:0;padding:20px;pointer-events:none';\n        cap.innerHTML = '<div style=\"font-family:\\'Playfair Display\\',serif;font-weight:500;font-size:22px;color:#FAEDE6;line-height:1.1\">' + label + '<\u002Fdiv><div class=\"ge-cta\" style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#C08E3F;margin-top:6px;font-weight:600;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s\">Explore &#8594;<\u002Fdiv>';\n        card.appendChild(slot); card.appendChild(overlay); card.appendChild(border); card.appendChild(cap);\n        card.addEventListener('mouseenter', () => { border.style.borderColor = '#C08E3F'; const c = cap.querySelector('.ge-cta'); if (c) { c.style.opacity = '1'; c.style.transform = 'translateY(0)'; } });\n        card.addEventListener('mouseleave', () => { border.style.borderColor = 'transparent'; const c = cap.querySelector('.ge-cta'); if (c) { c.style.opacity = '0'; c.style.transform = 'translateY(6px)'; } });\n        grid.appendChild(card);\n      });\n    }\n\n    // Reveal on scroll (slow, cinematic, supports data-delay)\n    const revealEls = Array.from(document.querySelectorAll('[data-reveal]'));\n    revealEls.forEach((el) => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(42px)';\n      el.style.transition = 'opacity 1.1s cubic-bezier(.22,1,.36,1), transform 1.1s cubic-bezier(.22,1,.36,1)';\n      el.style.transitionDelay = (parseInt(el.dataset.delay, 10) || 0) + 'ms';\n      el.style.willChange = 'opacity, transform';\n    });\n    const show = (el) => { el.style.opacity = '1'; el.style.transform = 'none'; };\n    if (prefersReduced || !('IntersectionObserver' in window)) {\n      revealEls.forEach(show);\n    } else {\n      const ro = new IntersectionObserver((entries) => {\n        entries.forEach((e) => { if (e.isIntersecting) { show(e.target); ro.unobserve(e.target); } });\n      }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' });\n      revealEls.forEach((el) => ro.observe(el));\n      setTimeout(() => revealEls.forEach(show), 4500);\n    }\n\n    // Split-text hero headline\n    const splitEl = document.querySelector('[data-split]');\n    if (splitEl && !splitEl.dataset.split2) {\n      splitEl.dataset.split2 = '1';\n      const wrap = (node) => {\n        const frag = document.createDocumentFragment();\n        node.textContent.split(/(\\s+)/).forEach((tok) => {\n          if (/^\\s+$/.test(tok)) { frag.appendChild(document.createTextNode(tok)); return; }\n          if (tok === '') return;\n          const s = document.createElement('span');\n          s.className = 'gp-w';\n          s.style.cssText = 'display:inline-block;opacity:0;transform:translateY(1.05em);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)';\n          s.textContent = tok;\n          frag.appendChild(s);\n        });\n        node.parentNode.replaceChild(frag, node);\n      };\n      Array.from(splitEl.childNodes).forEach((n) => {\n        if (n.nodeType === 3) wrap(n);\n        else if (n.classList && n.classList.contains('gp-word')) {\n          n.style.display = 'inline-block'; n.style.opacity = '0'; n.style.transform = 'translateY(1.05em)';\n          n.style.transition = 'opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)';\n          n.classList.add('gp-w');\n        }\n      });\n      const words = splitEl.querySelectorAll('.gp-w');\n      if (prefersReduced) { words.forEach((w) => { w.style.opacity = '1'; w.style.transform = 'none'; }); }\n      else { words.forEach((w, i) => setTimeout(() => { w.style.opacity = '1'; w.style.transform = 'none'; }, 200 + i * 75)); }\n    }\n\n    // Counters\n    const counters = Array.from(document.querySelectorAll('.gp-counter'));\n    const runCounter = (el) => {\n      if (el.dataset.done) return; el.dataset.done = '1';\n      const target = parseInt(el.dataset.count, 10) || 0; const suffix = el.dataset.suffix || '';\n      if (prefersReduced) { el.textContent = target + suffix; return; }\n      const dur = 1700; const start = performance.now();\n      const tick = (now) => { const p = Math.min((now - start) / dur, 1); const e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(target * e) + suffix; if (p < 1) requestAnimationFrame(tick); };\n      requestAnimationFrame(tick);\n    };\n    if ('IntersectionObserver' in window) {\n      const co = new IntersectionObserver((entries) => { entries.forEach((e) => { if (e.isIntersecting) { runCounter(e.target); co.unobserve(e.target); } }); }, { threshold: 0.5 });\n      counters.forEach((el) => co.observe(el));\n    } else { counters.forEach(runCounter); }\n\n    // Magnetic buttons\n    if (!prefersReduced && window.matchMedia('(pointer:fine)').matches) {\n      document.querySelectorAll('[data-magnetic]').forEach((btn) => {\n        btn.style.transition = 'transform .25s cubic-bezier(.22,1,.36,1)';\n        btn.addEventListener('mousemove', (ev) => { const r = btn.getBoundingClientRect(); btn.style.transform = 'translate(' + (ev.clientX - r.left - r.width / 2) * 0.4 + 'px,' + (ev.clientY - r.top - r.height / 2) * 0.4 + 'px)'; });\n        btn.addEventListener('mouseleave', () => { btn.style.transform = 'translate(0,0)'; });\n      });\n    }\n\n    // Hover slow-zoom + gallery captions\n    document.querySelectorAll('[data-zoom]').forEach((wrap) => {\n      const slot = wrap.querySelector('image-slot'); const cap = wrap.querySelector('.gp-gcap');\n      if (slot) { slot.style.transition = 'transform 1.2s cubic-bezier(.22,1,.36,1)'; slot.style.transformOrigin = 'center'; }\n      wrap.addEventListener('mouseenter', () => { if (slot && !prefersReduced) slot.style.transform = 'scale(1.07)'; if (cap) cap.style.opacity = '1'; });\n      wrap.addEventListener('mouseleave', () => { if (slot) slot.style.transform = 'scale(1)'; if (cap) cap.style.opacity = '0'; });\n    });\n\n    // AI preview animations\n    const playAI = (el) => {\n      if (el.dataset.played) return; el.dataset.played = '1';\n      const kind = el.dataset.ai;\n      if (kind === 'budget') {\n        const rows = el.querySelectorAll('.gp-brow'); const label = el.querySelector('.gp-gen-label');\n        rows.forEach((r) => { r.style.opacity = '0'; r.style.transform = 'translateY(8px)'; r.style.transition = 'opacity .5s, transform .5s'; });\n        if (prefersReduced) { rows.forEach((r) => { r.style.opacity = '1'; r.style.transform = 'none'; }); if (label) label.style.display = 'none'; return; }\n        rows.forEach((r, i) => setTimeout(() => { r.style.opacity = '1'; r.style.transform = 'none'; }, 400 + i * 320));\n        if (label) setTimeout(() => { label.style.transition = 'opacity .4s'; label.style.opacity = '0'; }, 400 + rows.length * 320);\n      } else if (kind === 'checklist') {\n        const fill = el.querySelector('.gp-progfill'); const num = el.querySelector('.gp-prog-num'); const target = 52;\n        if (prefersReduced) { if (fill) fill.style.width = target + '%'; if (num) num.textContent = target; return; }\n        setTimeout(() => { if (fill) fill.style.width = target + '%'; }, 300);\n        if (num) { const s = performance.now(); const tk = (n) => { const p = Math.min((n - s) / 1400, 1); num.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tk); }; setTimeout(() => requestAnimationFrame(tk), 300); }\n      } else if (kind === 'chat') {\n        const typing = el.querySelector('.gp-typing'); const reply = el.querySelector('.gp-reply');\n        if (prefersReduced) { if (typing) typing.style.display = 'none'; if (reply) { reply.style.opacity = '1'; reply.style.transform = 'none'; } return; }\n        setTimeout(() => { if (typing) typing.style.display = 'none'; if (reply) { reply.style.opacity = '1'; reply.style.transform = 'none'; } }, 1700);\n      }\n    };\n    const aiPreviews = Array.from(document.querySelectorAll('.gp-ai-preview'));\n    if ('IntersectionObserver' in window && !prefersReduced) {\n      const ao = new IntersectionObserver((entries) => { entries.forEach((e) => { if (e.isIntersecting) { playAI(e.target); ao.unobserve(e.target); } }); }, { threshold: 0.4 });\n      aiPreviews.forEach((el) => ao.observe(el));\n    } else { aiPreviews.forEach(playAI); }\n\n    // Culture chips\n    const chips = Array.from(document.querySelectorAll('#ge-culture .gp-culchip'));\n    chips.forEach((chip) => {\n      chip.addEventListener('click', () => {\n        chips.forEach((c) => {\n          const on = c === chip;\n          c.style.background = on ? '#7B1F2A' : '#fff'; c.style.color = on ? '#fff' : '#4E1218';\n          c.style.fontWeight = on ? '600' : '500'; c.style.borderColor = on ? '#7B1F2A' : 'rgba(123,31,42,.2)';\n        });\n      });\n    });\n\n    // Dashboard quick-link lift\n    document.querySelectorAll('.gp-qlink').forEach((q) => {\n      q.addEventListener('mouseenter', () => { q.style.transform = 'translateY(-3px)'; q.style.boxShadow = '0 12px 26px rgba(78,18,24,.16)'; });\n      q.addEventListener('mouseleave', () => { q.style.transform = 'none'; q.style.boxShadow = 'none'; });\n    });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
